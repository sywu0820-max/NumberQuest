<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172443">
  <title>Number Quest · Make Ten Overflow</title>
  <link rel="stylesheet" href="make-ten-overflow.css?v=0-2">
  <script>window.__NQ_MAKE_TEN_ERRORS__=[];addEventListener('error',e=>window.__NQ_MAKE_TEN_ERRORS__.push(String(e.error?.stack||e.message)));addEventListener('unhandledrejection',e=>window.__NQ_MAKE_TEN_ERRORS__.push(String(e.reason)))</script>
</head>
<body>
  <header><a href="index.html">← Number Quest</a><b>✦ NUMBER QUEST</b><span></span></header>
  <main id="app" hidden>
    <section id="sources" aria-label="兩群球">
      <div id="sourceA" class="source a" aria-label="第一群球"></div>
      <div id="sourceB" class="source b" aria-label="第二群球"></div>
    </section>
    <section id="work">
      <div id="frame" class="frame" role="group" aria-label="透明十格框">
        <div id="slots" class="slots"></div>
        <div id="overflow" aria-label="超過十格的已選球"></div>
      </div>
      <output id="relation" aria-live="polite"></output>
    </section>
    <output id="debug" hidden></output>
  </main>
  <script type="module" src="make-ten-overflow.js?v=0-2"></script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#172443">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="數字探險">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="v03.css">
<title>Number Quest v0.3</title>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div class="stats">
      <div class="pill">💎 <span id="gems">0</span></div>
      <div class="pill">⚡ Lv.<span id="level">1</span></div>
      <div class="pill">🔥 <span id="streakDays">1</span> 天</div>
    </div>
    <button class="ghost" id="collectionBtn">🎒 圖鑑 <span id="collectionCount">0</span>/20</button>
  </div>

  <section id="home">
    <div class="hero">
      <div class="rocket">🚀</div>
      <h1>數字探險隊</h1>
      <p>今天也來收一個新寶物吧！</p>
    </div>
    <div class="section-title"><h2>✨ 今日任務</h2><span id="dailyBonus"></span></div>
    <div id="daily" class="daily"></div>
    <div class="section-title"><h2>🗺️ 探險地圖</h2><span>每第 3 趟會遇到 Boss</span></div>
    <div id="worlds" class="worlds"></div>
  </section>

  <section id="game" class="game">
    <div class="game-head">
      <button class="ghost" id="homeBtn">← 地圖</button>
      <div id="mode" class="mode"></div>
      <div class="pill">💎 <span id="gameGems">0</span></div>
    </div>
    <h2 id="worldTitle"></h2>
    <div id="bossPanel" class="boss-panel">
      <div class="boss-face">👾</div>
      <b>Boss 能量</b>
      <div class="hpbar"><i id="hpbar"></i></div>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div id="combo" class="combo"></div>
    <div class="mascot" id="mascot">🦊</div>
    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
    <div class="msg" id="msg">選一個答案！</div>
  </section>
</main>

<div id="resultOverlay" class="overlay"><div class="card">
  <div id="resultEmoji" class="big">🏆</div>
  <h2 id="resultTitle">探險完成！</h2>
  <p id="resultText"></p>
  <div id="newCollectible" style="font-size:22px;font-weight:900;margin:16px"></div>
  <button class="primary" id="resultBtn">回到地圖</button>
</div></div>

<div id="collectionOverlay" class="overlay"><div class="card">
  <div class="big">🎒</div><h2>探險圖鑑</h2>
  <p>普通寶物靠探險收集，稀有寶物要打倒 Boss。</p>
  <div id="collectionGrid" class="collection-grid"></div>
  <button class="primary" id="closeCollection">繼續探險</button>
</div></div>

<script type="module" src="v03-app.js"></script>
</body></html>

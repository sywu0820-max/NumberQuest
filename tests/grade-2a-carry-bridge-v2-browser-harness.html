<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交換橋島 V2 Browser Semantic Validation</title><style>body{font:16px system-ui;background:#14314b;color:#fff;margin:0;padding:24px}main{max-width:900px;margin:auto}.pass{color:#79efb1}.case{border:1px solid #ffffff33;border-radius:14px;padding:12px;margin:10px 0}pre{white-space:pre-wrap;word-break:break-word}</style><script>window.__HARNESS_ERRORS__=[];addEventListener('error',event=>window.__HARNESS_ERRORS__.push(String(event.error?.stack||event.message)));addEventListener('unhandledrejection',event=>window.__HARNESS_ERRORS__.push(String(event.reason)))</script></head><body><main><h1>交換橋島 V2 Browser Semantic Validation</h1><p id="status">RUNNING</p><div id="cases"></div><pre id="evidence"></pre></main><script type="module">
import {CARRY_BRIDGE_V2_RULES,applyCarryBridgeV2Action,canonicalCarryBridgeV2Actions,carryBridgeV2ActionFor,carryBridgeV2DebugReadback,carryBridgeV2Scene,createCarryBridgeV2Session,replayCarryBridgeV2Actions} from '../src/grade-2a-carry-bridge-v2.mjs?v=v2-2';
const seeded=seed=>()=>((seed=Math.imul(seed,1664525)+1013904223>>>0)/4294967296),make=(ruleId,seed)=>createCarryBridgeV2Session(ruleId,{rng:seeded(seed),sourceNonce:seed}),solve=(source,path)=>replayCarryBridgeV2Actions(source,canonicalCarryBridgeV2Actions(source.problem),{interactionPath:path});
const progressiveDisclosure=CARRY_BRIDGE_V2_RULES.flatMap(ruleId=>Array.from({length:80},(_,offset)=>{let current=make(ruleId,offset+1),scenes=[];for(const action of canonicalCarryBridgeV2Actions(current.problem)){const scene=carryBridgeV2Scene(current);scenes.push({id:scene.id,visible:scene.visibleAffordances});current=applyCarryBridgeV2Action(current,action)}return {ruleId,complete:current.coreState.complete,scenes,bounded:scenes.every(scene=>scene.visible.length<=2)}}));
const objectCompletion=CARRY_BRIDGE_V2_RULES.map(ruleId=>{const complete=solve(make(ruleId,91),'tap-direct'),readback=carryBridgeV2DebugReadback(complete);return {ruleId,complete:complete.coreState.complete,noAnswerInput:readback.childLoop.answerInputPresent===false,completionSource:readback.childLoop.completionSource,automatic:complete.interactionLog.at(-1).automaticObjectStateCompletion===true}});
const invalidExchange=[9,11].map(count=>{let current=make('add-regroup',34);current=applyCarryBridgeV2Action(current,carryBridgeV2ActionFor(current,'merge-groups'));const before=JSON.stringify(current.coreState.workspace);current=applyCarryBridgeV2Action(current,carryBridgeV2ActionFor(current,'bundle-ten',{count}));return {count,code:current.coreState.lastActionResult.code,neutral:current.coreState.lastActionResult.neutral,preserved:before===JSON.stringify(current.coreState.workspace),complete:current.coreState.complete}});
const pathEquivalence=CARRY_BRIDGE_V2_RULES.map(ruleId=>{const tap=solve(make(ruleId,62),'tap-direct'),drag=solve(make(ruleId,62),'pointer-drag');return {ruleId,complete:tap.coreState.complete&&drag.coreState.complete,equal:JSON.stringify(tap.coreState.actionTrace)===JSON.stringify(drag.coreState.actionTrace)}});
const fixedScriptResistance=CARRY_BRIDGE_V2_RULES.map(ruleId=>{const fixed=canonicalCarryBridgeV2Actions(make(ruleId,1).problem);let completed=0;for(let seed=2;seed<=201;seed++)if(replayCarryBridgeV2Actions(make(ruleId,seed),fixed).coreState.complete)completed++;return {ruleId,completed,total:200,resistant:completed<20}});
const pristine=make('add-regroup',71),snapshot=JSON.stringify(pristine);applyCarryBridgeV2Action(pristine,carryBridgeV2ActionFor(pristine,'merge-groups'));const sourceImmutability={preserved:JSON.stringify(pristine)===snapshot};
const sample=carryBridgeV2DebugReadback(solve(make('sub-regroup',88),'tap-direct')),evidenceBoundary={...sample.evidenceBoundary,noWrites:Object.values(sample.evidenceBoundary).every(value=>value===false),noMastery:sample.classification.formalMasteryClaimed===false,noLedger:sample.classification.ledgerWritePerformed===false},pageErrors=[...window.__HARNESS_ERRORS__];
const evidence={progressiveDisclosure,objectCompletion,invalidExchange,pathEquivalence,fixedScriptResistance,sourceImmutability,evidenceBoundary,pageErrors};for(const [name,value] of Object.entries(evidence)){const card=document.createElement('section');card.className='case';card.innerHTML=`<h2>${name}</h2><p>${JSON.stringify(value)}</p>`;document.getElementById('cases').append(card)}document.getElementById('evidence').textContent=JSON.stringify(evidence,null,2);
const passed=progressiveDisclosure.every(item=>item.complete&&item.bounded)&&objectCompletion.every(item=>item.complete&&item.noAnswerInput&&item.completionSource==='object-state'&&item.automatic)&&invalidExchange.every(item=>item.code==='invalid-exchange-unit-count'&&item.neutral&&item.preserved&&!item.complete)&&pathEquivalence.every(item=>item.complete&&item.equal)&&fixedScriptResistance.every(item=>item.resistant)&&sourceImmutability.preserved&&evidenceBoundary.noWrites&&evidenceBoundary.noMastery&&evidenceBoundary.noLedger&&pageErrors.length===0;document.getElementById('status').className=passed?'pass':'';document.getElementById('status').textContent=passed?'PASS: V2 semantic checks':'FAIL';
</script></body></html>

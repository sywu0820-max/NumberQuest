<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交換橋工坊 Prototype Browser Validation</title><style>body{font:16px system-ui;background:#102a42;color:#fff;margin:0;padding:24px}main{max-width:900px;margin:auto}.pass{color:#79efb1}.case{border:1px solid #ffffff33;border-radius:14px;padding:12px;margin:10px 0}pre{white-space:pre-wrap;word-break:break-word}</style><script>window.__HARNESS_ERRORS__=[];addEventListener('error',e=>window.__HARNESS_ERRORS__.push(String(e.error?.stack||e.message)));addEventListener('unhandledrejection',e=>window.__HARNESS_ERRORS__.push(String(e.reason)))</script></head><body><main><h1>交換橋工坊 Prototype Browser Validation</h1><p id="status">RUNNING</p><div id="cases"></div><pre id="evidence"></pre></main><script type="module">
import {CARRY_BRIDGE_PROTOTYPE_RULES,applyCarryBridgePrototypeIntent,canonicalCarryBridgePrototypeIntents,carryBridgePrototypeDebugReadback,carryBridgePrototypeNeutralSurface,createCarryBridgePrototypeSession,replayCarryBridgePrototypeIntents} from '../src/grade-2a-carry-bridge-prototype.mjs?v=prototype-2';
const seeded=seed=>()=>((seed=Math.imul(seed,1664525)+1013904223>>>0)/4294967296),make=(ruleId,seed)=>createCarryBridgePrototypeSession(ruleId,{rng:seeded(seed),sourceNonce:seed}),solve=(source,path)=>replayCarryBridgePrototypeIntents(source,canonicalCarryBridgePrototypeIntents(source.problem),{interactionPath:path});
const neutralSurface=[['add-no-regroup','add-regroup'],['sub-no-regroup','sub-regroup']].map(([a,b])=>({a,b,equal:JSON.stringify(carryBridgePrototypeNeutralSurface(make(a,1).problem))===JSON.stringify(carryBridgePrototypeNeutralSurface(make(b,2).problem))}));
const pathEquivalence=CARRY_BRIDGE_PROTOTYPE_RULES.map(ruleId=>{const tap=solve(make(ruleId,10),'tap-select-place'),drag=solve(make(ruleId,10),'pointer-drag');return {ruleId,complete:tap.coreState.complete&&drag.coreState.complete,equal:JSON.stringify(tap.coreState.actionTrace)===JSON.stringify(drag.coreState.actionTrace)}});
const invalidBundles=[9,11].map(count=>{let current=make('add-regroup',20);current=applyCarryBridgePrototypeIntent(current,{type:'join-loads'});const before=JSON.stringify(current.coreState.workspace);current=applyCarryBridgePrototypeIntent(current,{type:'bundle-ones',count},{interactionPath:'pointer-drag'});return {count,code:current.coreState.lastActionResult.code,neutral:current.coreState.lastActionResult.neutral,preserved:before===JSON.stringify(current.coreState.workspace)}});
const unnecessaryExchange=['add-no-regroup','sub-no-regroup'].map(ruleId=>{let current=make(ruleId,30);current=applyCarryBridgePrototypeIntent(current,current.problem.operation==='add'?{type:'bundle-ones',count:10}:{type:'split-ten',count:1});current=solve(current,'tap-select-place');const readback=carryBridgePrototypeDebugReadback(current);return {ruleId,complete:readback.state.complete,independent:readback.classification.independentAcquisitionEligible,codes:readback.classification.traceSummary.disqualifyingSemanticCodes}});
const wrongSubmitRecovery=CARRY_BRIDGE_PROTOTYPE_RULES.map(ruleId=>{let current=make(ruleId,40);current=applyCarryBridgePrototypeIntent(current,{type:'submit-answer',answer:current.problem.answer===0?1:current.problem.answer-1});current=solve(current,'tap-select-place');const readback=carryBridgePrototypeDebugReadback(current);return {ruleId,complete:readback.state.complete,independent:readback.classification.independentAcquisitionEligible,codes:readback.classification.traceSummary.disqualifyingSemanticCodes,noWrites:!readback.evidenceBoundary.ledgerWritePerformed&&!readback.evidenceBoundary.formalMasteryClaimed&&!readback.evidenceBoundary.persisted}});
const fixedTraceResistance=CARRY_BRIDGE_PROTOTYPE_RULES.map(ruleId=>{const fixed=canonicalCarryBridgePrototypeIntents(make(ruleId,1).problem);let completed=0;for(let seed=2;seed<=201;seed++)if(replayCarryBridgePrototypeIntents(make(ruleId,seed),fixed).coreState.complete)completed++;return {ruleId,completed,total:200,resistant:completed<20}});
const pageErrors=[...window.__HARNESS_ERRORS__],evidence={neutralSurface,pathEquivalence,invalidBundles,unnecessaryExchange,wrongSubmitRecovery,fixedTraceResistance,pageErrors};for(const [name,value] of Object.entries(evidence)){const card=document.createElement('section');card.className='case';card.innerHTML=`<h2>${name}</h2><p>${JSON.stringify(value)}</p>`;document.getElementById('cases').append(card)}document.getElementById('evidence').textContent=JSON.stringify(evidence,null,2);const passed=neutralSurface.every(x=>x.equal)&&pathEquivalence.every(x=>x.complete&&x.equal)&&invalidBundles.every(x=>x.code==='invalid-exchange-unit-count'&&x.neutral&&x.preserved)&&unnecessaryExchange.every(x=>x.complete&&!x.independent&&x.codes.includes('unnecessary-exchange'))&&wrongSubmitRecovery.every(x=>x.complete&&!x.independent&&x.codes.includes('numeric-answer-incorrect')&&x.noWrites)&&fixedTraceResistance.every(x=>x.resistant)&&pageErrors.length===0;document.getElementById('status').className=passed?'pass':'';document.getElementById('status').textContent=passed?'PASS: all hidden prototype browser semantic checks':'FAIL';
</script></body></html>

<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number Quest v0.9 Browser Validation</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:24px;background:#f5f7fb;color:#172443}main{max-width:960px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.case{background:#fff;border:1px solid #ccd5e4;border-radius:12px;padding:14px}.pass{color:#087443;font-weight:800}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#172443;color:#fff;padding:12px;border-radius:8px}</style></head>
<body><main><h1>Number Quest v0.9 Browser Validation</h1><p id="status">Running...</p><div id="cases" class="grid"></div><pre id="evidence"></pre></main>
<script type="module">
import {freshState,recordSkillSuccess,recordSkillMiss,makeQuestionForSkill,recordMemoryPractice,memoryScheduleSnapshot,planTodaysAdventure,journeyPlanSummary,completeMemoryRetrieval,queueSpacedReview,questionFingerprint,takeNextJourneyQuestion,buildJourneyRecap,helpChoicesForQuestion,answerSafeVisualHintModel,visualHintRevealsAnswer,STORY_RELATIONSHIPS} from '../src/v09-core.mjs';
const seeded=seed=>()=>((seed=Math.imul(seed,1664525)+1013904223>>>0)/4294967296),s=freshState('2026-08-30');s.unlocked=8;
for(const key of ['add:20','sub:20','add:50','sub:50','add:100','sub:100','mul:1','mul:2','mul:5','mul:7'])for(let i=0;i<5;i++)recordSkillSuccess(s,key,{day:'2026-08-28'});recordSkillMiss(s,'sub:50',{day:'2026-08-29'});
const scheduled=makeQuestionForSkill('add:20',s,{rng:seeded(7)});recordMemoryPractice(s,scheduled,{day:'2026-08-29'});const frozen=memoryScheduleSnapshot(s)['add:20'];

const memoryIdentity={sameFingerprint:memory.memoryFingerprint===frozen.fingerprint,before,nextDue:memoryScheduleSnapshot(s)['add:20'].dueDay};
const transfers=plan.filter(q=>q.journeyPurpose==='transfer'),transferSafety={count:transfers.length,allChanged:transfers.every(q=>q.transferFrom!==q.journeyRepresentation),allSameSkill:transfers.every(q=>typeof q.skillKey==='string'),relationships:transfers.filter(q=>q.story).map(q=>q.storyRelationshipId)};
const missing={op:'mul',variant:'missing',a:7,b:6,result:42,ans:7,skillKey:'mul:7',txt:'? × 6 = 42',hint:'想想每一組'},choices=helpChoicesForQuestion(missing),helpSafety={hasText:Boolean(choices.text),hasVisual:Boolean(choices.visual),visualSafe:!visualHintRevealsAnswer(choices.visual?.model,missing),textSafe:!/答案是|正確答案/.test(choices.text.text)};
const division={op:'div',variant:'quotient',dividend:42,divisor:7,quotient:6,result:6,ans:6,skillKey:'div:7'},divisionModel=answerSafeVisualHintModel(division,{level:2}),divisionSafety={groupCount:divisionModel.groupCount,groupSize:divisionModel.groupSize,answerHidden:divisionModel.groupSize==='?'&&divisionModel.groups===undefined};
const ownershipState=freshState('2026-08-30');ownershipState.unlocked=8;for(const key of ['add:20','sub:20','add:50','sub:50','mul:2','mul:5'])for(let i=0;i<4;i++)recordSkillSuccess(ownershipState,key,{day:'2026-08-28'});const shared=makeQuestionForSkill('add:20',ownershipState,{rng:seeded(77)}),sharedFingerprint=questionFingerprint(shared);recordMemoryPractice(ownershipState,shared,{day:'2026-08-29'});queueSpacedReview(ownershipState,shared);ownershipState.learning.solvedTotal+=3;const ownershipQueue=planTodaysAdventure(ownershipState,{day:'2026-08-30',rng:seeded(2)}),ownershipSeen=new Set(),asked=[];for(let i=0;i<12;i++){const item=takeNextJourneyQuestion(ownershipState,ownershipQueue,{seenFingerprints:ownershipSeen,rng:seeded(100+i)});if(!item)break;const fingerprint=questionFingerprint(item);ownershipSeen.add(fingerprint);asked.push(item);ownershipState.learning.solvedTotal+=1}const sharedAsked=asked.filter(item=>questionFingerprint(item)===sharedFingerprint),runtimeOwnership={askedOnce:sharedAsked.length===1,memoryIdentity:sharedAsked[0]?.isMemoryReview===true,ordinaryIdentity:sharedAsked[0]?.isReview===true};

const diversity=plan.filter(q=>q.story).map(q=>({theme:q.storyThemeId,relationship:q.storyRelationshipId})),evidence={summary,memoryIdentity,transferSafety,helpSafety,divisionSafety,runtimeOwnership,recapTruth,diversity,relationshipCatalog:Object.values(STORY_RELATIONSHIPS)};
for(const [name,value] of Object.entries({summary,memoryIdentity,transferSafety,helpSafety,divisionSafety,runtimeOwnership,recapTruth})){const card=document.createElement('section');card.className='case';card.innerHTML=`<h2>${name}</h2><p>${JSON.stringify(value)}</p>`;document.getElementById('cases').append(card)}
const passed=summary.count===10&&summary.distinctSkills>=4&&!summary.duplicateConsecutive&&summary.maxSkillStreak<=2&&summary.maxFrictionStreak<=2&&summary.memoryCount<=2&&Object.values(memoryIdentity).every(Boolean)&&transferSafety.count>=1&&transferSafety.allChanged&&helpSafety.hasText&&helpSafety.hasVisual&&helpSafety.visualSafe&&helpSafety.textSafe&&divisionSafety.answerHidden&&runtimeOwnership.askedOnce&&runtimeOwnership.memoryIdentity&&!runtimeOwnership.ordinaryIdentity&&recapTruth.recoveries===2&&recapTruth.secureSkillKey===null&&recapTruth.noFalseStability;
document.getElementById('evidence').textContent=JSON.stringify(evidence,null,2);document.getElementById('status').className=passed?'pass':'';document.getElementById('status').textContent=passed?'PASS: all v0.9 browser semantic checks':'FAIL';
</script></body></html>

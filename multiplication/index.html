<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff7df" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>九九乘法大冒險</title>
  <style>
    :root{--ink:#26324a;--muted:#6b7280;--card:#fff;--line:#eadfca;--shadow:0 10px 30px rgba(63,50,34,.12)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,"SF Pro Rounded","Noto Sans TC",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 5%,rgba(255,209,102,.32),transparent 24%),radial-gradient(circle at 90% 15%,rgba(90,169,255,.20),transparent 25%),linear-gradient(180deg,#fff9e9,#f8fbff 55%,#fffdf7)}
    body{min-height:100vh;padding:20px 14px 36px}button,input{font:inherit}button{cursor:pointer;border:0}.app{width:min(920px,100%);margin:0 auto}.brand{display:flex;gap:14px;align-items:center;margin:4px 0 18px}.mascot{width:66px;height:66px;border-radius:22px;display:grid;place-items:center;font-size:38px;background:#fff;box-shadow:var(--shadow);transform:rotate(-4deg)}.brand h1{margin:0;font-size:clamp(27px,6vw,42px);line-height:1.05}.brand p{margin:7px 0 0;color:var(--muted);font-weight:700}.panel{background:rgba(255,255,255,.92);border:2px solid rgba(234,223,202,.8);border-radius:28px;padding:clamp(18px,4vw,30px);box-shadow:var(--shadow);backdrop-filter:blur(8px)}.hidden{display:none!important}h2{margin:0 0 8px;font-size:clamp(23px,5vw,32px)}.sub{margin:0 0 20px;color:var(--muted);line-height:1.6;font-weight:650}.count-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0 22px}.count-btn{min-height:74px;border-radius:20px;background:#fff;border:2px solid var(--line);color:var(--ink);font-weight:900;font-size:22px;box-shadow:0 5px 0 #eadfca;transition:.13s}.count-btn:hover{transform:translateY(-2px)}.count-btn.selected{background:#fff4c5;border-color:#f4b942;box-shadow:0 5px 0 #e6b234}.primary{width:100%;min-height:58px;border-radius:18px;background:linear-gradient(180deg,#65d99a,#47bf7f);color:white;font-size:20px;font-weight:900;box-shadow:0 6px 0 #299c64;padding:13px 18px}.primary:active{transform:translateY(3px);box-shadow:0 3px 0 #299c64}.secondary{border-radius:14px;padding:11px 14px;background:#f4f7fb;color:var(--ink);font-weight:800;border:1px solid #dce5f0}.history-wrap{margin-top:22px}.history-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.history-head h3{margin:0;font-size:19px}.records{display:grid;gap:9px}.record{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(4,minmax(68px,.7fr));gap:8px;align-items:center;padding:12px 14px;border:1px solid #e8e5dd;border-radius:16px;background:#fff;font-size:14px}.record strong{font-size:17px}.record span{color:var(--muted);font-weight:700}.record .score{color:#2a9967;font-size:19px;font-weight:900}.empty{padding:16px;border-radius:16px;background:#f8fafc;color:var(--muted);text-align:center;font-weight:700}.play-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.progress-text{font-weight:900}.timer{font-variant-numeric:tabular-nums;font-weight:900;background:#eef6ff;padding:8px 12px;border-radius:13px;color:#356da6}.bar{height:13px;border-radius:999px;background:#edf0f3;overflow:hidden;margin-bottom:26px}.bar>div{height:100%;width:0;background:linear-gradient(90deg,#5aa9ff,#8e7dff);transition:width .18s}.question{text-align:center;margin:8px 0 22px}.equation{font-size:clamp(56px,15vw,92px);font-weight:1000;line-height:1.05}.answer-row{display:flex;gap:10px;max-width:480px;margin:0 auto 13px}.answer{width:100%;min-height:70px;border-radius:19px;border:3px solid #d7e1ec;background:#fff;padding:10px 15px;text-align:center;font-size:35px;font-weight:950;color:var(--ink);outline:none}.answer:focus{border-color:#5aa9ff;box-shadow:0 0 0 5px rgba(90,169,255,.15)}.submit{min-width:126px;border-radius:19px;background:#5aa9ff;color:#fff;font-weight:950;font-size:20px;box-shadow:0 6px 0 #397cc3}.submit:active{transform:translateY(3px);box-shadow:0 3px 0 #397cc3}.feedback{min-height:31px;text-align:center;font-size:19px;font-weight:900}.feedback.ok{color:#2a9967}.feedback.no{color:#d95656}.result{text-align:center}.trophy{font-size:70px;margin-bottom:5px}.big-score{font-size:clamp(62px,18vw,100px);font-weight:1000;line-height:1;color:#2a9967;margin:10px 0}.big-score small{font-size:.27em;color:var(--muted)}.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}.stat{background:#f8fafc;border:1px solid #e4e9ef;border-radius:17px;padding:15px 8px}.stat b{display:block;font-size:22px;margin-bottom:5px}.stat span{font-size:13px;color:var(--muted);font-weight:800}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.danger{background:#fff0f0;color:#bb4545;border:1px solid #ffd0d0}.tiny{font-size:12px;color:var(--muted);line-height:1.5;margin-top:13px}
    @media(max-width:700px){body{padding:14px 10px 28px}.count-grid{grid-template-columns:repeat(2,1fr)}.count-btn:last-child{grid-column:1/-1}.record{grid-template-columns:1fr 1fr 1fr}.record .date{grid-column:1/-1}.record .avg{display:none}.result-grid{grid-template-columns:1fr 1fr}.answer-row{flex-direction:column}.submit{min-height:57px}.brand{align-items:flex-start}.mascot{width:58px;height:58px;font-size:33px}}
  </style>
</head>
<body>
<main class="app">
  <div class="brand"><div class="mascot" aria-hidden="true">🚀</div><div><h1>九九乘法大冒險</h1><p>快、準、開心地把 9×9 練熟！</p></div></div>
  <section id="home" class="panel">
    <h2>今天要挑戰幾題？</h2><p class="sub">從 1×1 到 9×9 隨機出題。答得越準、越快，就越厲害！</p>
    <div class="count-grid" aria-label="選擇題數"><button class="count-btn selected" data-count="50">50 題</button><button class="count-btn" data-count="75">75 題</button><button class="count-btn" data-count="100">100 題</button><button class="count-btn" data-count="125">125 題</button><button class="count-btn" data-count="150">150 題</button></div>
    <button id="start" class="primary">開始挑戰 🚀</button>
    <div class="history-wrap"><div class="history-head"><h3>📈 我的挑戰紀錄</h3><button id="clear" class="secondary danger">清除紀錄</button></div><div id="records" class="records"></div><p class="tiny">紀錄只存在這台裝置的瀏覽器，不需要帳號、不會上傳個人資料。</p></div>
  </section>
  <section id="play" class="panel hidden">
    <div class="play-top"><div id="progressText" class="progress-text">第 1 / 50 題</div><div id="timer" class="timer">00:00.0</div></div><div class="bar"><div id="progressBar"></div></div><div class="question"><div id="equation" class="equation">7 × 8 = ?</div></div>
    <form id="answerForm" autocomplete="off"><div class="answer-row"><input id="answer" class="answer" inputmode="numeric" pattern="[0-9]*" maxlength="2" aria-label="答案" placeholder="答案" autofocus/><button class="submit" type="submit">答題 ✓</button></div></form><div id="feedback" class="feedback" aria-live="polite"></div>
  </section>
  <section id="result" class="panel result hidden">
    <div id="trophy" class="trophy">🏆</div><h2 id="resultTitle">完成挑戰！</h2><div id="bigScore" class="big-score">100<small> / 100</small></div>
    <div class="result-grid"><div class="stat"><b id="correctStat">50 / 50</b><span>答對題數</span></div><div class="stat"><b id="timeStat">03:20</b><span>總時間</span></div><div class="stat"><b id="avgStat">4.0 秒</b><span>平均每題</span></div><div class="stat"><b id="bestStat">100 分</b><span>本機最佳</span></div></div>
    <div class="result-actions"><button id="again" class="primary">再挑戰一次</button><button id="homeBtn" class="secondary">回到首頁</button></div>
  </section>
</main>
<script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],HOME=$('#home'),PLAY=$('#play'),RESULT=$('#result'),KEY='multiplicationQuestHistoryV1';let selectedCount=50,questions=[],index=0,correct=0,startMs=0,tick=null,locked=false;
const readHistory=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}},writeHistory=rows=>localStorage.setItem(KEY,JSON.stringify(rows.slice(0,50)));
function formatTime(ms,decimal=false){const total=Math.max(0,ms)/1000,m=Math.floor(total/60),s=total-m*60;return decimal?`${String(m).padStart(2,'0')}:${s.toFixed(1).padStart(4,'0')}`:`${String(m).padStart(2,'0')}:${String(Math.floor(s)).padStart(2,'0')}`}
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderHistory(){const rows=readHistory(),el=$('#records');if(!rows.length){el.innerHTML='<div class="empty">還沒有紀錄。完成第一場挑戰後，成績會出現在這裡 ✨</div>';return}el.innerHTML=rows.map(r=>`<div class="record"><div class="date"><strong>${esc(r.date)}</strong><br><span>${r.count} 題挑戰</span></div><div><span>分數</span><br><b class="score">${r.score}</b></div><div><span>答對</span><br><strong>${r.correct}/${r.count}</strong></div><div><span>時間</span><br><strong>${esc(r.time)}</strong></div><div class="avg"><span>平均</span><br><strong>${r.avg.toFixed(1)}s</strong></div></div>`).join('')}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuestions(n){const base=[];for(let a=1;a<=9;a++)for(let b=1;b<=9;b++)base.push({a,b,answer:a*b});const out=[];while(out.length<n){for(const q of shuffle(base)){if(out.length>=n)break;out.push(q)}}return out}
function show(section){[HOME,PLAY,RESULT].forEach(x=>x.classList.add('hidden'));section.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function updateQuestion(){const q=questions[index];$('#equation').textContent=`${q.a} × ${q.b} = ?`;$('#progressText').textContent=`第 ${index+1} / ${selectedCount} 題`;$('#progressBar').style.width=`${index/selectedCount*100}%`;$('#answer').value='';$('#feedback').textContent='';$('#feedback').className='feedback';locked=false;setTimeout(()=>$('#answer').focus(),30)}
function startGame(){questions=makeQuestions(selectedCount);index=0;correct=0;locked=false;startMs=performance.now();show(PLAY);updateQuestion();clearInterval(tick);tick=setInterval(()=>{$('#timer').textContent=formatTime(performance.now()-startMs,true)},100)}
function finishGame(){clearInterval(tick);const elapsed=performance.now()-startMs,score=Math.round(correct/selectedCount*100),avg=elapsed/1000/selectedCount,now=new Date(),date=now.toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),history=readHistory();history.unshift({date,count:selectedCount,correct,score,time:formatTime(elapsed),avg,ts:Date.now()});writeHistory(history);renderHistory();const best=Math.max(...readHistory().map(r=>r.score));$('#bigScore').innerHTML=`${score}<small> / 100</small>`;$('#correctStat').textContent=`${correct} / ${selectedCount}`;$('#timeStat').textContent=formatTime(elapsed);$('#avgStat').textContent=`${avg.toFixed(1)} 秒`;$('#bestStat').textContent=`${best} 分`;if(score===100){$('#trophy').textContent='🏆';$('#resultTitle').textContent='滿分！九九乘法王者！'}else if(score>=90){$('#trophy').textContent='🌟';$('#resultTitle').textContent='太厲害了！'}else if(score>=80){$('#trophy').textContent='🚀';$('#resultTitle').textContent='很棒，再快一點點！'}else{$('#trophy').textContent='💪';$('#resultTitle').textContent='完成就是進步！再挑戰一次吧！'}$('#progressBar').style.width='100%';show(RESULT)}
$$('.count-btn').forEach(btn=>btn.addEventListener('click',()=>{selectedCount=Number(btn.dataset.count);$$('.count-btn').forEach(b=>b.classList.toggle('selected',b===btn))}));$('#start').addEventListener('click',startGame);$('#again').addEventListener('click',startGame);$('#homeBtn').addEventListener('click',()=>show(HOME));$('#clear').addEventListener('click',()=>{if(confirm('確定要清除這台裝置上的全部挑戰紀錄嗎？')){localStorage.removeItem(KEY);renderHistory()}});$('#answerForm').addEventListener('submit',e=>{e.preventDefault();if(locked)return;const raw=$('#answer').value.trim();if(raw==='')return;const value=Number(raw);if(!Number.isFinite(value))return;locked=true;const q=questions[index],ok=value===q.answer;if(ok){correct++;$('#feedback').textContent='答對了！✨';$('#feedback').className='feedback ok'}else{$('#feedback').textContent=`差一點～正確答案是 ${q.answer}`;$('#feedback').className='feedback no'}setTimeout(()=>{index++;if(index>=selectedCount)finishGame();else updateQuestion()},ok?280:650)});renderHistory()})();
</script>
</body>
</html>
